<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel ="stylesheet" href = "login.css">
    <script src ="login.js" type ="module" defer></script>
    <title>Login </title>
</head>
<body>
   
        <section class ="login-box"> <!--Right side of page-->

            <div class = "input-area">
                <label for="email-input" class ="login-input-label"></label>
                <input placeholder="Enter Email" id ="email-input" class ="registration-input-box">
            </div>
            <div class ="error-messsge" id ="email-error-message-box"></div>

            <div class = "input-area">
                <label for ="password-input" class ="login-input-label" class ="registration-input-box"></label> 
                <input placeholder ="Enter Password" id = "password-input">
            </div>
            <div class ="error-messsge" id ="password-error-message-box"></div>

            <button class ="log-in-confirm-button" id ="log-in-confirm-button">
                Sign Up
            </button>
            <div class ="error-messsge" id ="log-in-error-message-box"></div>

        </section>

</body>
</html>
